<!DOCTYPE html>
<html lang="en">
<head>

<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% -20%, #16294a 0%, #0a1628 60%);
    color: #eef1f7;
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 48px 24px;
    text-align: center;
  }
  .mark {
    width: 72px; height: 72px;
    border: 1.5px solid #c9a84c88;
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 28px;
    background: #c9a84c14;
  }
  .mark svg { width: 38px; height: 38px; }
  h1 {
    font-family: "Iowan Old Style", Palatino, Georgia, serif;
    font-size: 42px;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin-bottom: 12px;
  }
  .tagline { color: #aab4c8; max-width: 34ch; margin-bottom: 10px; }
  .soon {
    color: #c9a84c;
    font-size: 13px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 600;
    margin-top: 18px;
  }
  footer { margin-top: 64px; display: flex; gap: 28px; }
  footer a { color: #aab4c8; text-decoration: none; font-size: 14px; border-bottom: 1px solid #aab4c833; padding-bottom: 2px; }
  footer a:hover, footer a:focus { color: #c9a84c; border-color: #c9a84c; }

</head>
