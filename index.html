<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DuaLock: Coming soon</title>
<meta name="description" content="DuaLock is coming soon to the App Store. Join the waitlist and we'll email you the day it launches.">
<meta name="theme-color" content="#0b1628">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="assets/site.css">
<link rel="preconnect" href="https://api.dualock.app" crossorigin>
<meta property="og:type" content="website">
<meta property="og:site_name" content="DuaLock">
<meta property="og:title" content="DuaLock: Coming soon">
<meta property="og:description" content="DuaLock is coming soon to the App Store. Join the waitlist and we'll email you the day it launches.">
<meta property="og:image" content="https://dualock.app/assets/img/og-soon.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The DuaLock app icon with the words Coming soon.">
<meta name="twitter:card" content="summary_large_image">
<style>
  /* Coming-soon page. Shared tokens and base styles live in assets/site.css. */

  .soon {
    display: grid;
    place-items: center;
    padding-block: clamp(3rem, 2rem + 6vh, 6rem);
    text-align: center;
  }

  .soon-icon {
    width: clamp(9.5rem, 7rem + 12vw, 13.5rem);
    aspect-ratio: 1;
    margin-inline: auto;
    border-radius: 22.37%;
    box-shadow:
      0 0 0 1px rgba(243, 238, 223, 0.14),
      0 30px 70px -20px rgba(0, 0, 0, 0.75),
      0 0 120px rgba(201, 168, 76, 0.28);
  }

  .soon-name {
    margin-top: clamp(1.75rem, 1.25rem + 2vw, 2.5rem);
    color: var(--gold);
    font: 700 0.9375rem/1.3 var(--font-head);
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  .soon h1 {
    margin-top: 0.35rem;
    font-size: clamp(3.5rem, 1.9rem + 8vw, 7rem);
    line-height: 0.98;
    letter-spacing: -0.035em;
  }

  .soon-lede {
    max-width: 25rem;
    margin: 1.25rem auto 0;
    color: var(--text-muted);
    font-size: clamp(1.0625rem, 1rem + 0.35vw, 1.1875rem);
  }

  .waitlist {
    display: flex;
    gap: 0.4rem;
    width: min(100%, 29rem);
    margin: 2rem auto 0;
    padding: 0.375rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    transition: border-color 0.2s, background-color 0.2s;
  }
  .waitlist[hidden] { display: none; }
  .waitlist:focus-within {
    border-color: var(--gold-line);
    background: var(--surface-strong);
  }

  .waitlist input {
    flex: 1;
    min-width: 0;
    min-height: 3rem;
    padding: 0 1.1rem;
    border: 0;
    background: transparent;
    color: var(--text);
    font: 400 1rem/1.2 var(--font-body);
  }
  .waitlist input::placeholder { color: var(--text-faint); }
  .waitlist input:focus-visible { outline: none; }

  .waitlist .button {
    min-height: 3rem;
    padding-inline: 1.4rem;
    border: 0;
    cursor: pointer;
    white-space: nowrap;
  }
  .waitlist .button:disabled { opacity: 0.7; cursor: progress; }

  @media (max-width: 30rem) {
    .waitlist {
      flex-direction: column;
      border-radius: var(--radius);
    }
    .waitlist input { text-align: center; }
    .waitlist .button { width: 100%; border-radius: 12px; }
  }

  .honeypot {
    position: absolute;
    left: -10000px;
    width: 1px;
    height: 1px;
    overflow: hidden;
  }

  .waitlist-error {
    min-height: 1.5rem;
    margin-top: 0.75rem;
    color: #f0b37e;
    font-size: 0.9375rem;
  }
  .waitlist-error:empty { display: none; }

  .waitlist-note {
    margin-top: 0.9rem;
    color: var(--text-faint);
    font-size: 0.875rem;
  }

  .joined {
    width: min(100%, 29rem);
    margin: 2rem auto 0;
    padding: 1.5rem 1.25rem;
    border: 1px solid var(--gold-line);
    border-radius: var(--radius);
    background: var(--gold-wash);
  }
  .joined:focus { outline: none; }
  .joined-check {
    display: grid;
    place-items: center;
    width: 2.75rem;
    height: 2.75rem;
    margin: 0 auto 0.85rem;
    border-radius: 50%;
    background: var(--gold);
    color: var(--navy-900);
  }
  .joined-check .icon { stroke-width: 2.4; }
  .joined-title { font: 700 1.375rem/1.2 var(--font-head); }
  .joined p:last-child { margin-top: 0.4rem; color: var(--text-muted); }

  .soon-footer {
    padding-block: 1.5rem 2rem;
    color: var(--text-faint);
    font-size: 0.875rem;
    text-align: center;
  }
  .soon-footer ul {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.25rem 1.25rem;
    margin: 0 0 0.5rem;
    padding: 0;
    list-style: none;
  }
  .soon-footer a {
    display: inline-block;
    padding-block: 0.35rem;
    color: var(--text-muted);
    text-decoration: none;
  }
  .soon-footer a:hover { color: var(--text); text-decoration: underline; }

  @media (prefers-reduced-motion: no-preference) {
    .rise { animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .rise-2 { animation-delay: 0.08s; }
    .rise-3 { animation-delay: 0.16s; }
    .rise-4 { animation-delay: 0.24s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
    }
  }
</style>
</head>
<body>

<main id="main" class="container soon">
  <div>
    <img class="soon-icon rise" src="assets/img/icon-640.webp" width="640" height="640" alt="DuaLock app icon: hands raised in dua beneath a mosque dome and a crescent moon">
    <p class="soon-name rise rise-2">DuaLock</p>
    <h1 class="rise rise-2">Coming soon</h1>
    <p class="soon-lede rise rise-3">Join the waitlist and we'll email you the day DuaLock lands on the App&nbsp;Store.</p>

    <div class="rise rise-4">
      <form id="waitlist" class="waitlist" novalidate>
        <label class="visually-hidden" for="email">Email address</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="Your email" required>
        <div class="honeypot" aria-hidden="true">
          <label for="company">Leave this empty</label>
          <input id="company" name="company" type="text" tabindex="-1" autocomplete="off">
        </div>
        <button class="button" type="submit">Join the waitlist</button>
      </form>
      <p id="waitlist-error" class="waitlist-error" role="alert"></p>
      <p id="waitlist-note" class="waitlist-note">We'll only email you about DuaLock. <a href="privacy/#waitlist">Privacy</a></p>

      <div id="joined" class="joined" tabindex="-1" hidden>
        <div class="joined-check" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
        </div>
        <p class="joined-title">You're on the list</p>
        <p>We'll email you as soon as DuaLock is on the App&nbsp;Store.</p>
      </div>
    </div>
  </div>
</main>

<footer class="soon-footer">
  <ul>
    <li><a href="privacy/">Privacy Policy</a></li>
    <li><a href="mailto:skalmandev@gmail.com">skalmandev@gmail.com</a></li>
  </ul>
  <p>© 2026 DuaLock</p>
</footer>

<script>
  (function () {
    var form = document.getElementById("waitlist");
    var email = form.elements.email;
    var button = form.querySelector("button");
    var error = document.getElementById("waitlist-error");
    var note = document.getElementById("waitlist-note");
    var joined = document.getElementById("joined");

    // Where the visitor came from, e.g. ?utm_source=instagram or the referring site.
    var params = new URLSearchParams(location.search);
    var source = params.get("utm_source") || params.get("ref") || "";
    if (!source && document.referrer) {
      try { source = new URL(document.referrer).hostname; } catch (e) {}
    }

    function done() {
      form.hidden = true;
      note.hidden = true;
      joined.hidden = false;
      joined.focus();
    }

    function fail(message) {
      error.textContent = message;
      button.disabled = false;
      button.textContent = "Join the waitlist";
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      error.textContent = "";
      email.value = email.value.trim();
      if (!email.checkValidity()) {
        error.textContent = "Please enter a valid email address.";
        email.focus();
        return;
      }

      button.disabled = true;
      button.textContent = "Joining…";

      fetch("https://api.dualock.app/waitlist", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email.value, company: form.elements.company.value, source: source || "direct" })
      })
        .then(function (response) {
          if (response.ok) return done();
          fail(response.status === 400
            ? "Please enter a valid email address."
            : "Something went wrong. Please try again.");
        })
        .catch(function () {
          fail("Couldn't reach the server. Check your connection and try again.");
        });
    });
  })();
</script>
</body>
</html>
